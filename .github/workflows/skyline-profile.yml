name: Check Profile Files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/skyline.js'
      - 'tests/**'
      - '.github/workflows/skyline-profile.yml'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check data and renderer
        run: |
          python -m unittest discover -s tests -v
          node --test tests/skyline.test.cjs
          node --check docs/skyline.js
