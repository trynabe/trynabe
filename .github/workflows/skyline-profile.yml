name: Update Contribution Skyline

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *' # 08:17 Bangkok
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/skyline.*'
      - 'docs/index.html'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/skyline-profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-skyline
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'trynabe/trynabe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check data and renderer
        run: |
          python -m unittest discover -s tests -v
          node --test tests/skyline.test.cjs
          node --check docs/skyline.js
      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: trynabe
        run: python scripts/update_contributions.py
      - name: Render animated skyline
        run: |
          python scripts/render_profile_gif.py
          cp contributions.json docs/contributions.json
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contribution-skyline.gif contribution-skyline-3d.png contribution-card.svg contributions.json docs/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update contribution skyline'
            git push
          fi
