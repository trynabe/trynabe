name: Update Contribution Skyline

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contribution-skyline
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check profile logic
        run: |
          python -m unittest discover -s tests -v
          node --test tests/skyline.test.cjs
          node --check docs/skyline.js

  refresh:
    needs: check
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          (needs.check.result == 'success' || needs.check.result == 'skipped') &&
          github.ref == 'refs/heads/main' && github.repository == 'trynabe/trynabe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the profile contribution calendar
        run: python scripts/refresh_profile.py
      - id: changed
        name: Check whether new assets are needed
        run: |
          cp contributions.json docs/contributions.json
          if [ "$GITHUB_EVENT_NAME" = push ] || ! git diff --quiet -- contributions.json contribution-card.svg docs/contributions.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install renderer when activity changes
        if: steps.changed.outputs.changed == 'true'
        run: |
          python -m pip install -r requirements.txt
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'SKYLINE_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Render the new README image
        if: steps.changed.outputs.changed == 'true'
        run: python scripts/render_profile_gif.py
      - name: Save the generated assets
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md contribution-skyline.gif contribution-skyline-3d.png contribution-card.svg contributions.json docs/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh contribution skyline'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.changed == 'true'
        with:
          path: docs

  deploy-pages:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
