name: Refresh contribution trail

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
  push:
    paths:
      - '.github/workflows/contribution-trail.yml'

concurrency:
  group: profile-contribution-trail
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate the contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/terminal/contributions.svg?palette=github-dark&color_snake=%23ffce82&color_dots=%23304351,%232b755f,%233fc182,%2375d88d,%23b6f388

      - name: Commit the refreshed trail
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/terminal/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution trail'
          git pull --rebase origin "$PROFILE_BRANCH"
          git push origin "HEAD:refs/heads/$PROFILE_BRANCH"
